name: Daily alert emails

# Reliable external scheduler for logged-in daily stock emails. It calls the
# backend endpoint that respects each user's selected email_time and duplicate
# email logs, so the web server does not have to stay awake all evening.

on:
  schedule:
    # Every 15 minutes from 15:30-22:45 IST on weekdays.
    - cron: "*/15 10-16 * * 1-5"
    - cron: "0,15 17 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: daily-alert-emails
  cancel-in-progress: false

jobs:
  process-due-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Call scheduled daily email endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ALERT_ADMIN_KEY: ${{ secrets.ALERT_ADMIN_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::Missing GitHub Actions secret BACKEND_URL."
            exit 1
          fi
          if [ -z "${ALERT_ADMIN_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret ALERT_ADMIN_KEY."
            exit 1
          fi
          case "$BACKEND_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::BACKEND_URL must start with http:// or https://."
              exit 1
              ;;
          esac

          endpoint="${BACKEND_URL%/}/api/v1/daily-updates/run-scheduled?wait=1"
          echo "Calling scheduled daily email endpoint: ${endpoint}"
          status_code="$(
            curl --silent --show-error --location \
            --connect-timeout 20 \
            --max-time 900 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --request POST \
            --header "x-alert-admin-key: ${ALERT_ADMIN_KEY}" \
            --output response.json \
            --write-out "%{http_code}" \
            "$endpoint"
          )"

          echo "Backend HTTP status: ${status_code}"

          # The repository is public, and so is this log: print a summary, never
          # the raw response, which names each recipient's email address.
          STATUS_CODE="$status_code" python - <<'PY'
          import json
          import os
          import re
          import sys


          def redact(text):
              return re.sub(r"[\w.+-]+@[\w-]+(?:\.[\w-]+)+", "<email>", str(text))


          status = int(os.environ["STATUS_CODE"])
          try:
              with open("response.json", "r", encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError):
              payload = {}
          if not isinstance(payload, dict):
              payload = {}

          if not 200 <= status < 300:
              detail = redact(payload.get("detail") or "no detail")[:300]
              print(f"::error::Daily email endpoint returned HTTP {status}: {detail}")
              sys.exit(1)

          emails = payload.get("emails") or {}
          delivery = emails.get("delivery") or {}
          attempted = int(delivery.get("attempted", emails.get("attempted", 0)) or 0)
          sent = int(delivery.get("sent", emails.get("sent", 0)) or 0)
          failed = int(delivery.get("failed", emails.get("failed", 0)) or 0)
          skipped = int(delivery.get("skipped", emails.get("delivery_skipped", 0)) or 0)
          skip_reasons = emails.get("skipped") or {}
          reasons = sorted({
              redact(item.get("error") or item.get("reason") or "no reason given")[:300]
              for item in emails.get("notifications") or []
              if item.get("status") != "sent"
          })

          print(
              "Email summary: "
              f"considered={emails.get('considered', 0)} "
              f"attempted={attempted} sent={sent} failed={failed} "
              f"provider_skipped={skipped} skip_reasons={skip_reasons}"
          )
          for reason in reasons:
              print(f"Not sent: {reason}")

          if attempted and (failed or skipped or sent != attempted):
              print(
                  "::error::The email provider refused daily emails "
                  f"({reasons[0] if reasons else 'no reason given'}). Check "
                  "RESEND_API_KEY and ALERT_FROM_EMAIL on the backend."
              )
              sys.exit(1)
          if skip_reasons.get("gave_up"):
              print(
                  "::error::Daily emails stopped retrying after repeated failures "
                  "this evening. The backend's email_logs table has the reason."
              )
              sys.exit(1)
          PY
